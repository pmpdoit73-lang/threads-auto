name: 버튼 확인 및 게시

on:
  # 알람 서비스(cron-job.org)가 한국 06:00~23:40 사이 20분마다 깨움
  workflow_dispatch: {}  # Actions 탭에서 "Run workflow"로 수동 실행

permissions:
  contents: write  # 초안 상태(drafts/, state/)를 저장소에 저장

concurrency:
  group: threads-bot  # 초안 만들기와 버튼 확인이 동시에 돌지 않게
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 버튼 확인 및 게시
        run: python src/poll.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: 텔레그램 점검 기록
        if: always()
        run: python src/diag.py || true
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: 상태 저장
        if: always()
        run: |
          git config user.name "threads-auto-bot"
          git config user.email "threads-auto-bot@users.noreply.github.com"
          git add -A drafts/ state/ 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "버튼 확인 및 게시 $(date -u +%Y%m%d-%H%M)"
          git pull --rebase origin main
          git push origin HEAD:main
