name: 초안 만들기

on:
  schedule:
    # GitHub는 UTC 기준 (한국 = UTC + 9시간). 예약 실행이 몇 시간씩 늦을 수 있어서
    # 2시간마다 여러 번 돌고, 돌 때마다 게시 7시간 전 안에 든 빈 회차만 채움
    # 16,18,20,22,0,2,4,6,8,10시 UTC = 한국 01,03,05,07,09,11,13,15,17,19시
    - cron: "13 16,18,20,22 * * *"
    - cron: "13 0,2,4,6,8,10 * * *"
  # 알람 서비스(cron-job.org)가 한국 08·14·18·22시에 깨움 (force 없이 → 빈 회차만 채움)
  # Actions 탭에서 "Run workflow"로 수동 실행할 때 force를 체크하면 바로 만듦
  workflow_dispatch:
    inputs:
      force:
        description: "시간 상관없이 바로 초안 만들기"
        type: boolean
        default: false

permissions:
  contents: write  # 초안 상태(drafts/, state/)를 저장소에 저장

concurrency:
  group: threads-bot  # 초안 만들기와 버튼 확인이 동시에 돌지 않게
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 초안 만들기
        run: python src/make_draft.py
        env:
          FORCE: ${{ inputs.force && '1' || '' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: 상태 저장
        if: always()
        run: |
          git config user.name "threads-auto-bot"
          git config user.email "threads-auto-bot@users.noreply.github.com"
          git add -A drafts/ state/ 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "초안 만들기 $(date -u +%Y%m%d-%H%M)"
          git pull --rebase origin main
          git push origin HEAD:main
