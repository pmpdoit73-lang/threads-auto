name: 초안 만들기

on:
  schedule:
    # GitHub는 UTC 기준: 21:30 UTC = 한국 06:30, 09:30 UTC = 한국 18:30
    - cron: "30 21 * * *"
    - cron: "30 9 * * *"
  workflow_dispatch: {}  # Actions 탭에서 "Run workflow" 버튼으로 수동 실행

permissions:
  contents: write  # 초안 기록(drafts/)을 저장소에 저장

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 초안 생성 후 텔레그램 전송
        run: python src/make_draft.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: 초안 기록 저장
        run: |
          git config user.name "threads-auto-bot"
          git config user.email "threads-auto-bot@users.noreply.github.com"
          git add drafts/
          git diff --cached --quiet || git commit -m "초안 기록 $(date -u +%Y%m%d-%H%M)"
          git push
