name: 프로필 사진 만들기

# Actions 탭에서 "Run workflow"로 수동 실행 → 후보 3장이 텔레그램으로 옴
on:
  workflow_dispatch:

permissions:
  contents: write  # 만든 사진을 state/profile/에 저장

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 프로필 사진 만들기
        run: python src/profile_pic.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: 사진 저장
        if: always()
        run: |
          git config user.name "threads-auto-bot"
          git config user.email "threads-auto-bot@users.noreply.github.com"
          git add -A state/profile/ 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "프로필 사진 후보 저장"
          git pull --rebase origin main
          git push origin HEAD:main
